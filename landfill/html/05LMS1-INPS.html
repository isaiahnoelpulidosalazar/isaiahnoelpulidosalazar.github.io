<!DOCTYPE html>
<html>
<body>

<head>
<title>Activity</title>
<link rel="stylesheet" type="text/css" href="style.css">
</head>

<h1>Squircle</h1>

<svg width="100" height="100" viewBox="0 0 10 10">
	<rect id="square" width="10" height="10"/>
		<animate
		xlink:href="#square"
		attributeName="rx"
		values="0;5;0"
		dur="3s"
		repeatCount="indefinite"/>
	</rect>
</svg>

</body>
</html>
