<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScreenShare — Host</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --accent: #00ff88;
    --accent2: #7c3aed;
    --text: #e2e8f0;
    --muted: #64748b;
    --danger: #ff4466;
    --warn: #f59e0b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* Subtle grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;
    border-bottom: 1px solid var(--border);
    background: rgba(10,10,15,0.9);
    backdrop-filter: blur(12px);
  }

  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
  }

  .logo span { color: var(--muted); }

  .role-badge {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    padding: 4px 12px;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 2px;
  }

  main {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px;
    gap: 32px;
  }

  /* ── IDLE STATE ── */
  .idle-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    max-width: 480px;
    width: 100%;
    text-align: center;
  }

  .idle-icon {
    width: 80px; height: 80px;
    border: 1px solid var(--border);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    font-size: 32px;
  }

  .idle-state h1 {
    font-size: 36px;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.02em;
  }

  .idle-state h1 em {
    font-style: normal;
    color: var(--accent);
  }

  .idle-state p {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
  }

  /* ── BUTTONS ── */
  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 14px 28px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .btn-primary {
    background: var(--accent);
    color: #0a0a0f;
    font-weight: 700;
  }
  .btn-primary:hover { background: #00e87a; transform: translateY(-1px); box-shadow: 0 0 24px rgba(0,255,136,0.3); }
  .btn-primary:active { transform: translateY(0); }

  .btn-danger {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
  }
  .btn-danger:hover { background: rgba(255,68,102,0.1); }

  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

  /* ── SESSION PANEL ── */
  .session-panel {
    display: none;
    flex-direction: column;
    gap: 20px;
    width: 100%;
    max-width: 760px;
  }

  .session-panel.visible { display: flex; }

  .info-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .info-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .info-value {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--text);
    word-break: break-all;
  }

  .copy-btn {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 6px 12px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── STATUS BAR ── */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .status-dot.waiting { background: var(--warn); box-shadow: 0 0 8px var(--warn); animation: pulse 1.5s infinite; }
  .status-dot.active { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 2s infinite; }
  .status-dot.ended { background: var(--danger); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .status-text { color: var(--muted); }
  .status-text strong { color: var(--text); }

  /* ── PREVIEW ── */
  .preview-container {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    aspect-ratio: 16/9;
    width: 100%;
  }

  .preview-container video,
  .preview-container canvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .preview-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
  }

  .preview-overlay .overlay-icon { font-size: 36px; opacity: 0.4; }

  /* live indicator */
  .live-badge {
    position: absolute;
    top: 12px; right: 12px;
    background: var(--danger);
    color: white;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    padding: 3px 8px;
    border-radius: 2px;
    display: none;
  }
  .live-badge.visible { display: block; animation: pulse 1.5s infinite; }

  /* ── CONTROLS ── */
  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  /* ── STATS ── */
  .stats-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .stat-chip {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 3px;
  }
  .stat-chip span { color: var(--accent); }

  /* ── LOG ── */
  .log {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    line-height: 1.8;
    color: var(--muted);
    max-height: 120px;
    overflow-y: auto;
  }
  .log-entry { display: flex; gap: 10px; }
  .log-time { color: var(--border); flex-shrink: 0; }
  .log-entry.ok .log-msg { color: var(--accent); }
  .log-entry.err .log-msg { color: var(--danger); }
  .log-entry.info .log-msg { color: var(--text); }

</style>
</head>
<body>

<header>
  <div class="logo">Screen<span>Share</span></div>
  <div class="role-badge">HOST</div>
</header>

<main>

  <!-- IDLE -->
  <div class="idle-state" id="idleState">
    <div class="idle-icon">🖥️</div>
    <h1>Share your<br><em>screen</em> live.</h1>
    <p>Create a session and instantly share your screen with anyone — no installs, no accounts. Just a link.</p>
    <button class="btn btn-primary" id="createBtn" onclick="createSession()">
      <span>⚡</span> Create Session
    </button>
  </div>

  <!-- SESSION ACTIVE -->
  <div class="session-panel" id="sessionPanel">

    <div class="info-card">
      <div>
        <div class="info-label">Viewer Link</div>
        <div class="info-value" id="viewerUrl">—</div>
      </div>
      <button class="copy-btn" onclick="copyUrl()">Copy Link</button>
    </div>

    <div class="info-card" style="padding: 12px 24px;">
      <div>
        <div class="info-label">Session ID</div>
        <div class="info-value" id="sessionIdDisplay" style="font-size:11px; color: var(--muted)">—</div>
      </div>
      <div class="status-bar" style="border:none; padding:0; background:none;">
        <div class="status-dot" id="statusDot"></div>
        <div class="status-text" id="statusText">Connecting…</div>
      </div>
    </div>

    <div class="preview-container">
      <video id="previewVideo" autoplay muted playsinline></video>
      <div class="preview-overlay" id="previewOverlay">
        <div class="overlay-icon">🖥️</div>
        <div>Press <strong style="color:var(--text)">Start Sharing</strong> to begin</div>
      </div>
      <div class="live-badge" id="liveBadge">● LIVE</div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="shareBtn" onclick="startSharing()">▶ Start Sharing</button>
      <button class="btn btn-danger" id="stopBtn" onclick="stopSharing()" disabled>■ Stop Sharing</button>
      <button class="btn" style="border:1px solid var(--border); color:var(--muted); background:transparent;"
              onclick="endSession()">✕ End Session</button>
    </div>

    <div class="stats-row" id="statsRow" style="display:none">
      <div class="stat-chip">FPS: <span id="statFps">0</span></div>
      <div class="stat-chip">Frames Sent: <span id="statFrames">0</span></div>
      <div class="stat-chip">Viewer: <span id="statViewer">Waiting</span></div>
    </div>

    <div class="log" id="log"></div>

  </div>
</main>

<script>
let sessionId = null;
let ws = null;
let stream = null;
let mediaRecorder = null;
let frameCanvas = null;
let frameCtx = null;
let frameInterval = null;
let frameCount = 0;
let isSharing = false;
let viewerConnected = false;

const BACKEND_URL = 'https://isaiahnoelpulidosalazar-github-io.onrender.com';
const WS_URL = 'wss://isaiahnoelpulidosalazar-github-io.onrender.com';

const FPS = 10; // 10fps for relay approach

function log(msg, type = 'info') {
  const el = document.getElementById('log');
  const now = new Date().toTimeString().slice(0,8);
  el.innerHTML += `<div class="log-entry ${type}"><span class="log-time">${now}</span><span class="log-msg">${msg}</span></div>`;
  el.scrollTop = el.scrollHeight;
}

function setStatus(state, text) {
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot ' + state;
  document.getElementById('statusText').innerHTML = text;
}

async function createSession() {
  const btn = document.getElementById('createBtn');
  btn.disabled = true;
  btn.textContent = 'Creating…';

  try {
    const res = await fetch(`${BACKEND_URL}/create-session`, { method: 'POST' });
    const data = await res.json();
    sessionId = data.sessionId;

    let basePath = window.location.href.split('?')[0].replace(/\/index\.html$/, '');
    if (!basePath.endsWith('/')) basePath += '/';
    const viewerUrl = `${basePath}viewer.html?session=${sessionId}`;

    document.getElementById('viewerUrl').textContent = viewerUrl;
    document.getElementById('sessionIdDisplay').textContent = data.sessionId;
    document.getElementById('idleState').style.display = 'none';
    document.getElementById('sessionPanel').classList.add('visible');
    document.getElementById('statsRow').style.display = 'flex';

    connectWs();
    log('Session created: ' + data.sessionId, 'ok');
  } catch (e) {
    log('Failed to create session: ' + e.message, 'err');
    btn.disabled = false;
    btn.textContent = '⚡ Create Session';
  }
}

function connectWs() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const url = `${WS_URL}/ws/${sessionId}`;
  ws = new WebSocket(url);
  setStatus('waiting', 'Connecting to relay…');

  ws.onopen = () => {
    setStatus('waiting', '<strong>Waiting</strong> for viewer to join…');
    log('Connected to relay server', 'ok');
  };

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      handleMessage(msg);
    } catch {}
  };

  ws.onclose = () => {
    setStatus('ended', 'Disconnected from relay');
    log('WebSocket closed', 'err');
    stopSharing();
  };

  ws.onerror = () => {
    log('WebSocket error', 'err');
  };
}

function handleMessage(msg) {
  if (msg.type === 'join' && msg.sender === 'viewer') {
    viewerConnected = true;
    setStatus('active', '<strong>Viewer connected</strong> — session ACTIVE');
    document.getElementById('statViewer').textContent = 'Connected';
    log('Viewer joined the session!', 'ok');
  }
  if (msg.type === 'disconnect' && msg.sender === 'viewer') {
    viewerConnected = false;
    setStatus('waiting', '<strong>Waiting</strong> for viewer…');
    document.getElementById('statViewer').textContent = 'Disconnected';
    log('Viewer disconnected', 'err');
  }
}

async function startSharing() {
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: { ideal: 15, max: 30 }, cursor: 'always' },
      audio: false,
    });

    // Show preview
    const video = document.getElementById('previewVideo');
    video.srcObject = stream;
    document.getElementById('previewOverlay').style.display = 'none';
    document.getElementById('liveBadge').classList.add('visible');

    // Canvas for frame capture
    frameCanvas = document.createElement('canvas');
    frameCtx = frameCanvas.getContext('2d');

    isSharing = true;
    document.getElementById('shareBtn').disabled = true;
    document.getElementById('stopBtn').disabled = false;
    log('Screen capture started', 'ok');

    // Start frame loop
    startFrameLoop(video);

    // Handle user stopping via browser UI
    stream.getVideoTracks()[0].addEventListener('ended', () => {
      log('Screen share stopped by user', 'info');
      stopSharing();
    });
  } catch (e) {
    if (e.name === 'NotAllowedError') {
      log('Permission denied for screen capture', 'err');
    } else {
      log('Screen capture error: ' + e.message, 'err');
    }
  }
}

function startFrameLoop(video) {
  let lastFpsTime = Date.now();
  let fpsCount = 0;

  frameInterval = setInterval(() => {
    if (!isSharing || !ws || ws.readyState !== 1) return;
    if (!video.videoWidth) return;

    frameCanvas.width = video.videoWidth;
    frameCanvas.height = video.videoHeight;
    frameCtx.drawImage(video, 0, 0);

    // Use JPEG for lower bandwidth
    frameCanvas.toBlob((blob) => {
      if (!blob || !ws || ws.readyState !== 1) return;
      const reader = new FileReader();
      reader.onload = () => {
        const base64 = reader.result.split(',')[1];
        ws.send(JSON.stringify({
          type: 'screen-frame',
          sessionId,
          sender: 'host',
          payload: { frame: base64, w: frameCanvas.width, h: frameCanvas.height },
        }));
        frameCount++;
        fpsCount++;
        document.getElementById('statFrames').textContent = frameCount;
      };
      reader.readAsDataURL(blob);
    }, 'image/jpeg', 0.6);

    // FPS calc
    const now = Date.now();
    if (now - lastFpsTime >= 1000) {
      document.getElementById('statFps').textContent = fpsCount;
      fpsCount = 0;
      lastFpsTime = now;
    }
  }, 1000 / FPS);
}

function stopSharing() {
  isSharing = false;
  clearInterval(frameInterval);
  frameInterval = null;

  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  const video = document.getElementById('previewVideo');
  video.srcObject = null;
  document.getElementById('previewOverlay').style.display = 'flex';
  document.getElementById('liveBadge').classList.remove('visible');
  document.getElementById('shareBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;

  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'disconnect', sessionId, sender: 'host', payload: 'Host stopped sharing' }));
  }
  log('Screen sharing stopped', 'info');
}

function endSession() {
  stopSharing();
  if (ws) ws.close();
  location.reload();
}

function copyUrl() {
  const url = document.getElementById('viewerUrl').textContent;
  navigator.clipboard.writeText(url).then(() => {
    const btn = event.target;
    btn.textContent = '✓ Copied!';
    setTimeout(() => btn.textContent = 'Copy Link', 1500);
  });
}
</script>
</body>
</html>
