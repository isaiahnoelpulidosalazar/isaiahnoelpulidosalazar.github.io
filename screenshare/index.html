<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">

<body>
<header>
  <div class="logo">Screen<span>Share</span></div>
  <div class="role-badge">HOST</div>
</header>
<main>
  <div class="idle-state" id="idleState">
    <div class="idle-icon">🖥️</div>
    <h1>Share your<br><em>screen</em> live.</h1>
    <p>Create a session and instantly share your screen with anyone — no installs, no accounts. Just a link.</p>
    <button class="btn btn-primary" id="createBtn" onclick="createSession()">
      <span>⚡</span> Create Session
    </button>
  </div>
  <div class="session-panel" id="sessionPanel">
    <div class="info-card">
      <div>
        <div class="info-label">Viewer Link</div>
        <div class="info-value" id="viewerUrl">—</div>
      </div>
      <button class="copy-btn" onclick="copyUrl()">Copy Link</button>
    </div>
    <div class="info-card" style="padding: 12px 24px;">
      <div>
        <div class="info-label">Session ID</div>
        <div class="info-value" id="sessionIdDisplay" style="font-size:11px; color: var(--muted)">—</div>
      </div>
      <div class="status-bar" style="border:none; padding:0; background:none;">
        <div class="status-dot" id="statusDot"></div>
        <div class="status-text" id="statusText">Connecting…</div>
      </div>
    </div>
    <div class="preview-container">
      <video id="previewVideo" autoplay muted playsinline></video>
      <div class="preview-overlay" id="previewOverlay">
        <div class="overlay-icon">🖥️</div>
        <div>Press <strong style="color:var(--text)">Start Sharing</strong> to begin</div>
      </div>
      <div class="live-badge" id="liveBadge">● LIVE</div>
    </div>
    <div class="controls">
      <button class="btn btn-primary" id="shareBtn" onclick="startSharing()">▶ Start Sharing</button>
      <button class="btn btn-danger" id="stopBtn" onclick="stopSharing()" disabled>■ Stop Sharing</button>
      <button class="btn" style="border:1px solid var(--border); color:var(--muted); background:transparent;"
              onclick="endSession()">✕ End Session</button>
    </div>
    <div class="stats-row" id="statsRow" style="display:none">
      <div class="stat-chip">FPS: <span id="statFps">0</span></div>
      <div class="stat-chip">Frames Sent: <span id="statFrames">0</span></div>
      <div class="stat-chip">Viewer: <span id="statViewer">Waiting</span></div>
    </div>
    <div class="log" id="log"></div>
  </div>
</main>
<script>
let sessionId = null;
let ws = null;
let stream = null;
let pc = null;
let isSharing = false;
let viewerConnected = false;
let candidateQueue = [];

const BACKEND_URL = 'https://isaiahnoelpulidosalazar-github-io.onrender.com';
const WS_URL = 'wss://isaiahnoelpulidosalazar-github-io.onrender.com';
const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

function log(msg, type = 'info') {
  const el = document.getElementById('log');
  const now = new Date().toTimeString().slice(0,8);
  el.innerHTML += `<div class="log-entry ${type}"><span class="log-time">${now}</span><span class="log-msg">${msg}</span></div>`;
  el.scrollTop = el.scrollHeight;
}

function setStatus(state, text) {
  document.getElementById('statusDot').className = 'status-dot ' + state;
  document.getElementById('statusText').innerHTML = text;
}

async function createSession() {
  const btn = document.getElementById('createBtn');
  btn.disabled = true;
  btn.textContent = 'Creating…';

  try {
    const res = await fetch(`${BACKEND_URL}/create-session`, { method: 'POST' });
    const data = await res.json();
    sessionId = data.sessionId;

    let basePath = window.location.href.split('?')[0].replace(/\/index\.html$/, '');
    if (!basePath.endsWith('/')) basePath += '/';
    const viewerUrl = `${basePath}viewer.html?session=${sessionId}`;

    document.getElementById('viewerUrl').textContent = viewerUrl;
    document.getElementById('sessionIdDisplay').textContent = data.sessionId;
    document.getElementById('idleState').style.display = 'none';
    document.getElementById('sessionPanel').classList.add('visible');
    document.getElementById('statsRow').style.display = 'flex';

    connectWs();
    log('Session created: ' + data.sessionId, 'ok');
  } catch (e) {
    log('Failed to create session: ' + e.message, 'err');
    btn.disabled = false;
    btn.textContent = '⚡ Create Session';
  }
}

function connectWs() {
  ws = new WebSocket(`${WS_URL}/ws/${sessionId}`);
  setStatus('waiting', 'Connecting to relay…');

  ws.onopen = () => {
    setStatus('waiting', '<strong>Waiting</strong> for viewer to join…');
    log('Connected to relay server', 'ok');
  };

  ws.onmessage = async (e) => {
    try {
      const msg = JSON.parse(e.data);
      handleMessage(msg);
    } catch {}
  };

  ws.onclose = () => {
    setStatus('ended', 'Disconnected from relay');
    log('WebSocket closed', 'err');
    stopSharing();
  };
}

async function handleMessage(msg) {
  if (msg.type === 'join' && msg.sender === 'viewer') {
    viewerConnected = true;
    setStatus('active', '<strong>Viewer connected</strong> — session ACTIVE');
    document.getElementById('statViewer').textContent = 'Connected';
    log('Viewer joined the session!', 'ok');
    
    if (isSharing) createPeerConnection();
  }
  
  if (msg.type === 'disconnect' && msg.sender === 'viewer') {
    viewerConnected = false;
    setStatus('waiting', '<strong>Waiting</strong> for viewer…');
    document.getElementById('statViewer').textContent = 'Disconnected';
    log('Viewer disconnected', 'err');
    if (pc) pc.close();
  }

  if (msg.type === 'answer' && pc) {
    await pc.setRemoteDescription(new RTCSessionDescription(msg.payload));
    
    for (const candidate of candidateQueue) {
      await pc.addIceCandidate(candidate).catch(console.error);
    }
    candidateQueue = [];
  }
  
  if (msg.type === 'ice-candidate' && pc) {
    if (pc.remoteDescription && pc.remoteDescription.type) {
      await pc.addIceCandidate(new RTCIceCandidate(msg.payload)).catch(console.error);
    } else {
      candidateQueue.push(new RTCIceCandidate(msg.payload));
    }
  }
}

function createPeerConnection() {
  if (pc) pc.close();
  pc = new RTCPeerConnection(rtcConfig);

  pc.onicecandidate = (e) => {
    if (e.candidate) ws.send(JSON.stringify({ type: 'ice-candidate', sender: 'host', payload: e.candidate }));
  };

  pc.onnegotiationneeded = async () => {
    if (!viewerConnected) return;
    try {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      ws.send(JSON.stringify({ type: 'offer', sender: 'host', payload: pc.localDescription }));
    } catch (err) {
      log('Error creating offer: ' + err.message, 'err');
    }
  };

  if (stream) {
    stream.getTracks().forEach(track => pc.addTrack(track, stream));
  }
}

async function startSharing() {
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: { cursor: 'always' },
      audio: false,
    });

    const video = document.getElementById('previewVideo');
    video.srcObject = stream;
    document.getElementById('previewOverlay').style.display = 'none';
    document.getElementById('liveBadge').classList.add('visible');

    isSharing = true;
    document.getElementById('shareBtn').disabled = true;
    document.getElementById('stopBtn').disabled = false;
    log('Screen capture started', 'ok');

    createPeerConnection();

    stream.getVideoTracks()[0].addEventListener('ended', () => {
      log('Screen share stopped by user', 'info');
      stopSharing();
    });
  } catch (e) {
    log('Screen capture error: ' + e.message, 'err');
  }
}

function stopSharing() {
  isSharing = false;
  if (pc) pc.close();
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  const video = document.getElementById('previewVideo');
  video.srcObject = null;
  document.getElementById('previewOverlay').style.display = 'flex';
  document.getElementById('liveBadge').classList.remove('visible');
  document.getElementById('shareBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;

  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'disconnect', sessionId, sender: 'host', payload: 'Host stopped sharing' }));
  }
  log('Screen sharing stopped', 'info');
}

function endSession() {
  stopSharing();
  if (ws) ws.close();
  location.reload();
}

function copyUrl() {
  const url = document.getElementById('viewerUrl').textContent;
  navigator.clipboard.writeText(url).then(() => {
    const btn = event.target;
    btn.textContent = '✓ Copied!';
    setTimeout(() => btn.textContent = 'Copy Link', 1500);
  });
}

setInterval(async () => {
  if (pc && isSharing) {
    const stats = await pc.getStats();
    stats.forEach(report => {
      if (report.type === 'outbound-rtp' && report.kind === 'video') {
        document.getElementById('statFps').textContent = report.framesPerSecond || 0;
        document.getElementById('statFrames').textContent = report.framesSent || 0;
      }
    });
  }
}, 1000);
</script>
</body>
</html>
