name: Build inpsos

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm gcc-multilib genisoimage

    - name: Compile and Build ISO
      run: |
        cd os
        make

    - name: Upload ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: inpsos-iso
        path: os/inpsos.iso