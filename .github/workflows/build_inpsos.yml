name: Build inpsos

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: os

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-multilib qemu-utils xorriso

    - name: Compile and build inpsos
      run: make

    - name: Upload ISO artifact
      uses: actions/upload-artifact@v4
      with:
        name: inpsos-iso
        path: os/inpsos.iso

    - name: Upload raw IMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: inpsos-img
        path: os/inpsos.img

    - name: Upload VirtualBox VDI artifact
      uses: actions/upload-artifact@v4
      with:
        name: inpsos-vdi
        path: os/inpsos.vdi