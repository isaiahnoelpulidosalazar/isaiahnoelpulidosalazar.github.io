name: Build inpsos ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: os

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-multilib xorriso mtools grub-pc-bin grub-efi-amd64-bin grub-common

    - name: Compile and Build ISO
      run: make

    - name: Upload ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: inpsos-iso
        path: os/inpsos.iso