name: Build inpsos

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Toolchain and ISO Utilities
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm xorriso grub-pc-bin grub-common gcc-multilib make mtools

    - name: Compile OS Binary
      run: |
        cd os
        make

    - name: Construct GRUB Layout with Dynamic Modules
      run: |
        mkdir -p iso/boot/grub
        cp os/inpsos.bin iso/boot/
        mkdir -p iso/scripts
        cp os/*.easec iso/scripts/
        
        # Build grub.cfg and dynamically append the module imports
        cat << 'EOF' > iso/boot/grub/grub.cfg
        menuentry "inpsos" {
            multiboot /boot/inpsos.bin
        EOF
        
        for f in os/*.easec; do
            filename=$(basename "$f")
            name="${filename%.*}"
            echo "    module /scripts/$filename $name" >> iso/boot/grub/grub.cfg
        done
        
        cat << 'EOF' >> iso/boot/grub/grub.cfg
            boot
        }
        EOF

    - name: Assemble Bootable ISO Image
      run: |
        grub-mkrescue -o inpsos.iso iso

    - name: Archive ISO Output
      uses: actions/upload-artifact@v4
      with:
        name: inpsos-distribution-iso
        path: inpsos.iso