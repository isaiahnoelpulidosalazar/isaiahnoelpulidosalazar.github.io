name: Build inpsos

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust (Nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: x86_64-unknown-uefi, x86_64-unknown-none
          
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y xorriso mtools lld clang
        
      - name: Build Custom Bootloader
        run: |
          cd os/bootloader
          cargo build --release --target x86_64-unknown-uefi
        
      - name: Build Kernel & Easec
        run: |
          cd os/kernel
          cargo build --release --target x86_64-unknown-none
        
      - name: Create Bootable ISO
        run: |
          # 1. Dynamically locate the bootloader EFI in the workspace
          BOOTLOADER_PATH=$(find . -type f -name "bootloader.efi" | grep "release" | head -n 1)
          if [ -z "$BOOTLOADER_PATH" ]; then
            echo "Error: bootloader.efi not found!"
            exit 1
          fi
          
          # 2. Dynamically locate the kernel ELF
          KERNEL_PATH=$(find . -type f -name "kernel" | grep "release" | grep -v "/deps/" | grep -v "/build/" | grep -v "/incremental/" | head -n 1)
          if [ -z "$KERNEL_PATH" ]; then
            echo "Error: kernel binary not found!"
            exit 1
          fi
          
          # 3. Reference rootfs at os/rootfs
          ROOTFS_PATH="os/rootfs"
          if [ ! -d "$ROOTFS_PATH" ]; then
            echo "Error: os/rootfs folder not found!"
            exit 1
          fi
          
          echo "Found bootloader at: $BOOTLOADER_PATH"
          echo "Found kernel at: $KERNEL_PATH"
          echo "Found rootfs at: $ROOTFS_PATH"
          
          # 4. Pack into ISO Structure
          mkdir -p iso/EFI/BOOT
          cp "$BOOTLOADER_PATH" iso/EFI/BOOT/BOOTX64.EFI
          cp "$KERNEL_PATH" iso/kernel.elf
          cp -r "$ROOTFS_PATH" iso/
          
          # 5. Generate ISO
          xorriso -as mkisofs -R -f -e EFI/BOOT/BOOTX64.EFI -no-emul-boot \
            -o inpsos.iso iso/
            
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inpsos
          path: inpsos.iso