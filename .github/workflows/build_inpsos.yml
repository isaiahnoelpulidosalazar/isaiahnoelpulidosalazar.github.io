name: Build inpsos

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Rust (Nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y xorriso mtools lld clang
        
      - name: Build Custom Bootloader
        run: cd os/bootloader && cargo build --release --target x86_64-unknown-uefi
        
      - name: Build Kernel & Easec
        run: cd os/kernel && cargo build --release --target x86_64-unknown-none
        
      - name: Create Bootable ISO
        run: |
          mkdir -p iso/EFI/BOOT
          # Place bootloader
          cp os/bootloader/target/x86_64-unknown-uefi/release/bootloader.efi iso/EFI/BOOT/BOOTX64.EFI
          # Place kernel
          cp os/kernel/target/x86_64-unknown-none/release/kernel iso/kernel.elf
          # Place easec programs
          cp -r os/rootfs iso/
          # Generate ISO
          xorriso -as mkisofs -R -f -e EFI/BOOT/BOOTX64.EFI -no-emul-boot \
            -o inpsos.iso iso/
            
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v3
        with:
          name: inpsos
          path: inpsos.iso